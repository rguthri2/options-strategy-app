<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Options Strategy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-body">
  <form id="login" class="login-card">
    <svg viewBox="0 0 32 32" width="44" height="44" aria-hidden="true"><defs><linearGradient id="osg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34c77b"/><stop offset="1" stop-color="#2962ff"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#osg)"/><path d="M5 22h9l4-3 9-12" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="22" r="2.4" fill="#fff"/><path d="M5 26h22" stroke="#fff" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1>Options Strategy</h1>
    <p class="muted">Private workspace. Sign in to continue.</p>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="err" class="err" hidden></p>
  </form>
  <script src="js/login.js"></script>
</body>
</html>
